name: Build FitBody APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Expand FitBody design assets
        run: unzip -q assets-bundle.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Fix Android splash resources
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/fitbody_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF
      - name: Optimize Android release
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          android.enableR8.fullMode=true
          android.nonTransitiveRClass=true
          android.nonFinalResIds=true
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s=s.replace("minifyEnabled enableProguardInReleaseBuilds","minifyEnabled true")
          s=s.replace("shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)","shrinkResources true")
          p.write_text(s)
          PY
      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/FitBody.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FitBody-APK
          path: output/FitBody.apk
          retention-days: 30
